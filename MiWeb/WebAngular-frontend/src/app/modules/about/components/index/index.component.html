<div class="container px-4 py-5">
    <div class="row text-center">
        <div class="row mb-3">
            <div>
                <span class="section-name px-3 py-2 fw-bold">{{about.sectionName}}</span>
            </div>
        </div>
        <div class="row">
            <p class="fs-2"><b>{{about.title.split(",")[0]}}<span class="section-title">{{about.title.split(",")[1]}}</span></b></p>
        </div>
        <div class="container py-5">
            <div class="row">
                <div class="col-lg-6">
                    <img class="w-100" [src]="about.mainImagePath"/>
                </div>
                <div class="col-lg-6 px-4 text-start">
                    <div class="row mb-3">
                        <p><b class="fs-4">{{about.mainSubtitle}}</b></p>
                    </div>
                    <div class="row mb-3">
                        <i>{{about.secondarySubtitle}}</i>
                    </div>
                    <div class="row">
                        <div class="row mb-3" *ngFor="let item of aboutItems">
                            <div class="col-lg-2 px-1 d-flex align-items-center">
                                <div class="about-icon">
                                    <i class="{{item.icon}}"></i>
                                </div>
                            </div>
                            <div class="col-lg-10">
                                <div >
                                    <span class="fw-bold fs-5">{{item.title}}</span>
                                </div>
                                <div >
                                    <span>{{item.description}}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <p class="fs-9">{{about.description}}</p>
                    </div>
                </div>
            </div>   
        </div>
    </div>
</div>

<div class="container">
    <div class="row text-center">
        <div class="col-lg-6">
            <div class="row mb-3" *ngFor="let item of aboutStatistics.slice(0,3)">
                <div class="d-flex justify-content-between about-tech">
                    <span>{{item.name}}</span><span>{{item.quantity}}%</span>
                </div>
                <div class="progress about-progress">
                    <div class="progress-bar" role="progressbar" [style]="'width: ' + item.quantity + '%'" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>
        </div>     
        <div class="col-lg-6">
            <div class="row mb-3" *ngFor="let item of aboutStatistics.slice(3,6)">
                <div class="d-flex justify-content-between about-tech">
                    <span>{{item.name}}</span><span>{{item.quantity}}%</span>
                </div>
                <div class="progress about-progress">
                    <div class="progress-bar" role="progressbar" [style]="'width: ' + item.quantity + '%'" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>
        </div>  
    </div>  
</div>
