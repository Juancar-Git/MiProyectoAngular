<div class="position-relative overflow-hidden p-3 p-md-5 m-md-0 text-center bg-light homeview">
    <div class="col-md-5 p-lg-5 mr-auto my-5">
      <h1 class="display-4 fw-normal">{{home.title}}</h1>
      <p class="lead fw-normal text-muted">{{home.subtitle}}</p>

      <div>
        <a class="btn btn-primary" href="#">{{home.startButton}}</a>
        <a class="btn btn-link" href="#"><i class="bi bi-play-circle bicon"></i><span class="link-dark">{{home.videoButton}}</span></a>
      </div>
      
    </div>
    <div class="product-device shadow-sm d-none d-md-block"></div>
    <div class="product-device product-device-2 shadow-sm d-none d-md-block"></div>
</div>

<div class="container px-4 py-5" id="featured-3">
  <div class="row g-4 py-5 row-cols-1 row-cols-sm-2 row-cols-lg-4">
    <div class="col" *ngFor="let item of homeItems">
      <div class="feature-icon">
        <i class="bi {{item.icon}}"></i>
      </div>
      <h2>{{item.title}}</h2>
      <p>{{item.description}}</p>
    </div>
  </div>
</div>
