<div class="container p-3">
    <h1>titulo modal</h1>

    <div>
        <form [formGroup]="formGroup">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-sm-6 mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Name</label>
                        <input type="text" class="form-control" formControlName="name" name="name">
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Email</label>
                        <input type="email" class="form-control" formControlName="email" name="email">
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Subject</label>
                        <input type="text" class="form-control" formControlName="subject" name="subject">
                    </div>
                    <div class="col-12 mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Message</label>
                        <textarea id="message" rows="10" class="form-control" formControlName="messageText" name="messageText"></textarea>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <div>
        <button class="btn btn-light" (click)="cancelar()">Cancelar</button>
        <button class="btn btn-primary" (click)="guardar()">Guadar</button>
    </div>

</div>
