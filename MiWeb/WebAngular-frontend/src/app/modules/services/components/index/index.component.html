<div class="container px-4 py-5">
    <div class="row text-center">
        <div class="row mb-3">
            <div>
                <span class="section-name px-3 py-2 fw-bold">{{
                    services.sectionName
                    }}</span>
            </div>
        </div>
        <div class="row">
            <p class="fs-2">
                <b>{{ services.title.split(",")[0]}}<span class="section-title">{{services.title.split(",")[1]}}</span></b>
            </p>
        </div>

        <div class="container px-4 py-5" id="services-3">
            <div class="row g-4 row-cols-1 row-cols-sm-2 row-cols-lg-3">
                <div lass="col service-col" *ngFor="let item of servicesItems">
                    <div class="service-item">
                        <div class="feature-icon">
                            <i class="bi {{ item.icon }}"></i>
                        </div>
                        <h3>{{ item.title }}</h3>
                        <p>{{ item.description }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
